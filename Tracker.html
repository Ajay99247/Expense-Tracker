<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Tracker.css">
  </head>
  <body>
    <div class="header">
        <p class="m-0">Expense<br>Tracker
        <img src="./icon-wallet.png" alt="image" width="35px" /></p>
    </div>

    <div class="input-form">
        <div class="form-floating inputs">
            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Amount</label>
        </div>
        <select class="form-select inputs" aria-label="Default select example">
            <option selected>Transaction Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <div class="form-floating inputs">
            <input type="date" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Date</label>
        </div>
        <button class="btn" id="add-button">+</button>
    </div>

    <div class="cards mt-5">
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title m-0">Total Income
                    <img src="./icon-wallet.png" alt="image" width="25px" />
                </h5>
                <h1 class="m-0">
                    <img src="./money-icon.png" alt="image" width="25px" />
                    <span id="totalIncome" class="m-0">10,499</span>
                </h1>
            </div>
        </div>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title m-0">Total Expense
                    <img src="./icon-wallet.png" alt="image" width="25px" />
                </h5>
                <h1 class="m-0">
                    <img src="./money-icon.png" alt="image" width="25px" />
                    <span id="expense" class="m-0">5,499</span>
                </h1>
            </div>
        </div>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title m-0">Balance
                    <img src="./icon-wallet.png" alt="image" width="25px" />
                </h5>
                <h1 class="m-0">
                    <img src="./money-icon.png" alt="image" width="25px" />
                    <span id="balance" class="m-0">5,499</span>
                </h1>
            </div>
        </div>
    </div>
    <table class="transaction-table mt-4">
        <tr id="header-row">
            <th>Amount</th>
            <th>Transaction Type</th>
            <th>Transaction Date</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>10,499</td>
            <td>Income</td>
            <td>30-01-2026</td>
            <td>
                <button class="btn btn-md delete-button">
                    <img src="./delete-icon.png" alt="Delete" width="35px" />
                </button>
            </td>
        </tr>
         <tr>
            <td>5,499</td>
            <td>Expense</td>
            <td>30-01-2026</td>
            <td>
                <button class="btn btn-md delete-button">
                    <img src="./delete-icon.png" alt="Delete" width="35px" />
                </button>
            </td>
        </tr>
         <tr>
            <td>8,499</td>
            <td>INcome</td>
            <td>30-01-2026</td>
            <td>
                <button class="btn btn-md delete-button">
                    <img src="./delete-icon.png" alt="Delete" width="35px" />
                </button>
            </td>
        </tr>

    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  </body>
</html>
